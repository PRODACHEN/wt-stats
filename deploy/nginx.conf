# Копія /etc/nginx/sites-available/wt-stats у тому вигляді, як вона працює на сервері
# (блоки "managed by Certbot" дописав certbot --nginx). Не копіюйте цей файл поверх
# робочого конфігу без потреби: якщо сертифіката ще немає, спершу запустіть certbot.
server {
    server_name api.prodachen.pp.ua _;

    # Шар 1 захисту адмінки: з інтернету /admin/ не існує.
    # Адмінка доступна лише з самого сервера (127.0.0.1:8000) або через Tailscale.
    location ~ ^/admin(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.prodachen.pp.ua/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.prodachen.pp.ua/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.prodachen.pp.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.prodachen.pp.ua _;
    return 404; # managed by Certbot
}
