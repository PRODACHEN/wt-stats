server {
    listen 80;
    # "_" дозволяє відкривати сервіс і просто за IP, поки домен не запрацював
    server_name api.prodachen.pp.ua _;

    # Шар 1 захисту адмінки: з інтернету /admin/ не існує.
    # Адмінка доступна лише з самого сервера (127.0.0.1:8000) або через Tailscale.
    location ~ ^/admin(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
